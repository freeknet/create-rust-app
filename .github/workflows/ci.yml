name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 26]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v6 # TODO: pin to a reviewed full commit SHA.
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  scaffold:
    name: Scaffold ${{ matrix.preset }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        preset: [rustaman, strobe, cli, tui, lib, minimal]
        include:
          - os: ubuntu-latest
            preset: rustaman
            gate: check
          - os: ubuntu-latest
            preset: strobe
            gate: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v6 # TODO: pin to a reviewed full commit SHA.
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux' && (matrix.preset == 'rustaman' || matrix.preset == 'strobe')
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev
      - name: Scaffold and verify
        run: node scripts/scaffold-check.mjs ${{ matrix.preset }} --gate ${{ matrix.gate || 'full' }}
