# See the note at the top of bug_report.yml: an issue form has to be .yml.
name: Feature request
description: Suggest an improvement, a new feature, or something that should work better
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please search the [existing issues](https://github.com/@@github@@/@@name@@/issues) first; it may already be proposed.

  - type: textarea
    id: motivation
    attributes:
      label: Problem
      description: What is this for? What does it let someone do that they cannot today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
# @if kind_lib
      description: How you imagine it working. A sketch of the API you would call is the most useful thing here.
      render: rust
# @else
      description: How you imagine it working (interaction, defaults, flags). Sketches or mockups welcome.
# @end
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Anything else you tried or thought of, and why it does not cover the need.
