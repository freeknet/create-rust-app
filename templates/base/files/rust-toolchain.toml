# The toolchain everything is built and linted with.
#
# Pinned here rather than in CI because rustup reads this file for the
# directory, so a local `cargo clippy` and the one CI runs are the same
# clippy. A lint that does not exist locally cannot be caught locally.
# New lints arrive when this line is bumped, as a deliberate change, in the
# same commit as every workflow's `toolchain:` line.
[toolchain]
channel = "@@toolchain@@"
components = ["clippy", "rustfmt"]
targets = ["x86_64-pc-windows-msvc"]
